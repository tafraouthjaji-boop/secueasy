<style>
:root{--red:#c8102e;--dark:#161616;--bg:#f5f5f5;--line:#e2e2e2}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--dark)}
header{background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--red)}
header b{font-size:20px;color:#fff}header b span{color:var(--red)}
nav{display:flex;gap:6px;overflow-x:auto;background:#fff;padding:8px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:1;min-width:90px;padding:10px;border:0;background:#eee;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--red);color:#fff}
main{max-width:1000px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border-radius:12px;padding:14px;border-top:4px solid var(--red)}.kpi small{color:#666}.kpi div{font-size:22px;font-weight:700;margin-top:4px}
h2{margin:0 0 10px;font-size:18px}
input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit;background:#fff}
label{font-size:13px;color:#555;display:block;margin:6px 0 2px}
.btn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.k{background:var(--dark)}.btn.g{background:#eee;color:#111}.btn.s{padding:5px 9px;font-size:13px}
table{width:100%;border-collapse:collapse}th{background:var(--dark);color:#fff;padding:8px;font-size:13px;text-align:right}
td{padding:8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tw{overflow-x:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row>*{flex:1;min-width:130px}.row>.btn{flex:0 0 auto}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:#eee}.tag.r{background:#fde3e7;color:var(--red)}.tag.d{background:#222;color:#fff}
.low{color:var(--red);font-weight:700}
.sheet{background:#fff;max-width:760px;margin:0 auto;padding:28px;border:1px solid #ddd}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--red);padding-bottom:10px}
.sheet h1{white-space:nowrap;margin:0;color:var(--dark);font-size:28px}.sheet .nm{color:var(--red);font-size:26px;font-weight:800}
.cbox{background:#fdeef0;border-right:4px solid var(--red);padding:10px;margin:14px 0;border-radius:6px}
.sheet th{background:var(--red)}.tot{margin-right:auto;width:260px;margin-top:12px}.tot div{display:flex;justify-content:space-between;padding:5px 8px}
.tot .t{background:var(--red);color:#fff;font-weight:800;font-size:18px;border-radius:6px}
.sig{display:flex;justify-content:space-between;margin-top:40px;color:#555}
.hide{display:none}

body.p80 .sheet,body.p58 .sheet{margin:0 auto;padding:4px;font-size:12px;border:0}
body.p80 .sheet{width:72mm;max-width:72mm}body.p58 .sheet{width:48mm;max-width:48mm;font-size:11px}
body.p80 .sheet .top,body.p58 .sheet .top{display:block;text-align:center;padding-bottom:6px;border-bottom:2px dashed #000}
body.p80 .sheet .top>div,body.p58 .sheet .top>div{text-align:center!important}
body.p80 .sheet h1,body.p58 .sheet h1{font-size:16px}body.p80 .sheet .nm,body.p58 .sheet .nm{font-size:18px}
body.p80 .cbox,body.p58 .cbox{margin:6px 0;padding:4px;background:#fff;border:0;border-bottom:1px dashed #000;border-radius:0}
body.p80 .sheet th,body.p58 .sheet th{background:#fff;color:#000;border-bottom:1px solid #000;padding:2px;font-size:11px}
body.p80 .sheet td,body.p58 .sheet td{padding:2px;font-size:11px}
body.p80 .tot,body.p58 .tot{width:100%;margin:6px 0 0}body.p80 .tot .t,body.p58 .tot .t{background:#fff;color:#000;border:1px solid #000;border-radius:0}
body.p80 .sig,body.p58 .sig{margin-top:14px;font-size:11px}
body.p80 .sheet,body.p58 .sheet,body.p80 .sheet *,body.p58 .sheet *{color:#000}

.ptab{table-layout:fixed;width:100%}.ptab th{padding:6px 2px;font-size:11px}.ptab td{padding:6px 2px;font-size:12px;vertical-align:middle;text-align:center}.ptab th:nth-child(1),.ptab td:nth-child(1){width:38%;text-align:start}.ptab th:nth-child(2),.ptab td:nth-child(2){width:15%}.ptab th:nth-child(3),.ptab td:nth-child(3){width:15%}.ptab th:nth-child(4),.ptab td:nth-child(4){width:11%}.ptab th:nth-child(5),.ptab td:nth-child(5){width:21%}.ptab .pn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;line-height:1.3}.ptab td .btn{display:block;width:100%;margin:2px 0;padding:5px 2px;font-size:11px}.card.tw{padding:8px}}@media screen{.ptab,.ptab *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none}.prow.sel td{background:#fdeef0}.prow.sel td:first-child{box-shadow:inset 4px 0 var(--red)}.selbar{position:sticky;bottom:8px;z-index:6;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#161616;color:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 2px 10px #0004}.selbar .btn{padding:6px 9px}}</style></head><body>
<header><b>Secue<span>asy</span></b><span>تسيير المحل</span></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const K='secueasy_v1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{products:[],clients:[],docs:[],seq:{devis:0,facture:0,bon:0}};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const dfmt=d=>d.split('-').reverse().join('/');
let tab='home',view=null,draft=null,edit=null;
const tabs=[['home','الملخص'],['products','المنتجات والمخزون'],['clients','الزبائن'],['docs','عروض الثمن والفواتير'],['recv','استلام سلعة'],['stats','إحصائيات'],['backup','نسخة احتياطية']];
window.ivType=localStorage.getItem('sx_ivt')||'facture';
const isSale=d=>d.type==='facture'||d.type==='bon';
function totals(d){const ht=d.lines.reduce((a,l)=>a+l.qty*l.price,0);const tva=d.type==='bon'?0:ht*(d.tva/100);return{ht,tva,ttc:ht+tva}}
// number to Arabic words
function words(n){n=Math.floor(n);if(n===0)return'صفر';
const u=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const t=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const h=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
function b(x){const p=[];const hh=Math.floor(x/100),r=x%100;if(hh)p.push(h[hh]);if(r){if(r<20)p.push(u[r]);else{const o=r%10,tt=Math.floor(r/10);p.push(o?u[o]+' و'+t[tt]:t[tt])}}return p.join(' و')}
const parts=[];const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000;
if(m)parts.push(m===1?'مليون':m===2?'مليونان':b(m)+(m<=10?' ملايين':' مليون'));
if(k)parts.push(k===1?'ألف':k===2?'ألفان':b(k)+(k<=10?' آلاف':' ألف'));
if(r)parts.push(b(r));return parts.join(' و')}
function render(){
$('#nav').innerHTML=tabs.map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
const a=$('#app');
if(tab==='home')a.innerHTML=home();else if(tab==='products')a.innerHTML=products();else if(tab==='clients')a.innerHTML=clients();else if(tab==='recv')a.innerHTML=recv();else if(tab==='stats')a.innerHTML=stats();else if(tab==='docs')a.innerHTML=view?sheet(S.docs.find(d=>d.id===view)):draft?form():docs();else a.innerHTML=backup();
}
const selP=new Set();
function selClr(){selP.clear();render()}
function selAllP(){S.products.forEach(p=>selP.add(p.id));render()}
function toggleP(id){selP.has(id)?selP.delete(id):selP.add(id);render()}
function delSel(){const n=selP.size,T=x=>window.tr?tr(x):x;if(!n)return;if(!confirm(T('حذف المنتجات المحددة؟')+' ('+n+')\n'+T('لا يمكن التراجع.')))return;if(n===S.products.length&&!confirm(T('سيتم حذف كل المنتجات. هل أنت متأكد؟')))return;S.products=S.products.filter(p=>!selP.has(p.id));selP.clear();save();render()}
function go(t){selP.clear();tab=t;view=null;draft=null;edit=null;render();scrollTo(0,0)}
function home(){
const inv=S.docs.filter(d=>d.type==='facture');const paid=inv.filter(d=>d.paid);
const sum=a=>a.reduce((x,d)=>x+totals(d).ttc,0);
const mo=today().slice(0,7);const mi=inv.filter(d=>d.date.startsWith(mo));
const low=stockAlerts();
const val=S.products.reduce((x,p)=>x+p.stock*p.cost,0);
const cnt={};inv.forEach(d=>d.lines.forEach(l=>cnt[l.name]=(cnt[l.name]||0)+l.qty));
const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
return `<div class="grid"><div class="kpi"><small>مبيعات هذا الشهر (TTC)</small><div>${fmt(sum(mi))} د.م</div></div>
<div class="kpi"><small>إجمالي الفواتير</small><div>${fmt(sum(inv))} د.م</div></div>
<div class="kpi"><small>مدفوع</small><div>${fmt(sum(paid))} د.م</div></div>
<div class="kpi"><small>غير مدفوع</small><div>${fmt(sum(inv)-sum(paid))} د.م</div></div>
<div class="kpi"><small>قيمة المخزون (سعر الشراء)</small><div>${fmt(val)} د.م</div></div>
<div class="kpi"><small>عروض ثمن مفتوحة</small><div>${S.docs.filter(d=>d.type==='devis'&&!d.converted).length}</div></div></div>
${alertsCard()}
<div class="card"><h2>الأكثر مبيعاً</h2>${top.length?top.map(([n,q])=>`<div>${esc(n)}: ${q}</div>`).join(''):'<small>لا توجد فواتير بعد.</small>'}</div>
${S.products.length+S.clients.length+S.docs.length?'':'<div class="card">ابدأ بإضافة منتجات وزبائن، ثم أنشئ أول عرض ثمن.</div>'}`}
function products(){
const e=edit&&edit.k==='p'?edit.v:null;
return `<div class="card"><h2>${e&&e.id?'تعديل منتج':'إضافة منتج'}</h2><button class="btn k" id="mic" type="button" onclick="voiceP()" style="width:100%;margin-bottom:4px">🎤 قل اسم المنتج وثمنه</button><small id="vh" style="display:block;margin-bottom:8px"></small><div class="row"><div><label>الاسم</label><input id="pn" value="${esc(e?.name)}"></div>
<div><label>سعر البيع (HT)</label><input id="pp" type="number" value="${e?.price??''}"></div><div><label>سعر الشراء</label><input id="pc" type="number" value="${e?.cost??''}"></div>
<div><label>الكمية في المخزون</label><input id="ps" type="number" value="${e?.stock??''}"></div><div><label>الحد الأدنى</label><input id="pm" type="number" value="${e?(e.lock?e.min:effMin(e)):2}"><label style="display:flex;gap:6px;align-items:center;margin-top:6px"><input id="pa" type="checkbox" style="width:auto" ${e&&e.lock?'':'checked'}> حساب تلقائي من سرعة البيع</label></div>
<button class="btn" onclick="saveP('${e?.id||''}')">حفظ</button></div></div>
${selP.size?'':`<div class="noprint" style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 8px"><small style="color:#777">اضغط مطولاً على منتج لتحديده</small><button class="btn g s" onclick="selAllP()">تحديد الكل</button></div>`}<div class="card tw"><table class="ptab"><tr><th>المنتج</th><th>البيع</th><th>الشراء</th><th>المخزون</th><th></th></tr>
${S.products.map(p=>`<tr class="prow${selP.has(p.id)?' sel':''}" data-id="${p.id}"><td><div class="pn" title="${esc(p.name)}">${esc(p.name)}</div></td><td>${fmt(p.price)}</td><td>${fmt(p.cost)}</td><td class="${p.stock<=effMin(p)?'low':''}">${p.stock}</td>
<td><button class="btn g s" onclick="edit={k:'p',v:S.products.find(x=>x.id=='${p.id}')};render()">تعديل</button> <button class="btn g s" onclick="del('products','${p.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan=5>لا توجد منتجات.</td></tr>'}</table></div>${selP.size?`<div class="selbar noprint"><b><span>تم اختيار</span> ${selP.size}</b><span style="flex:1"></span><button class="btn g s" onclick="selAllP()">تحديد الكل</button><button class="btn g s" onclick="selClr()">إلغاء التحديد</button><button class="btn s" onclick="delSel()">حذف المحدد</button></div>`:''}`}
function saveP(id){const n=$('#pn').value.trim();if(!n)return alert('أدخل الاسم');
const o={name:n,price:+$('#pp').value||0,cost:+$('#pc').value||0,stock:+$('#ps').value||0,min:+$('#pm').value||0,lock:!$('#pa').checked};
if(id)Object.assign(S.products.find(p=>p.id===id),o);else S.products.push({id:uid(),...o});save();edit=null;render()}
function del(c,id){if(!confirm('تأكيد الحذف؟'))return;if(c==='docs'){const d=S.docs.find(x=>x.id===id);if(d&&isSale(d)&&d.stk!==0&&d.lines.some(l=>l.pid&&S.products.find(p=>p.id===l.pid))&&confirm('إرجاع كميات هذه الفاتورة إلى المخزون؟'))applyStock(d,-1)}S[c]=S[c].filter(x=>x.id!==id);save();render()}
function clients(){
const e=edit&&edit.k==='c'?edit.v:null;
return `<div class="card"><h2>${e&&e.id?'تعديل زبون':'إضافة زبون'}</h2><div class="row"><div><label>الاسم</label><input id="cn" value="${esc(e?.name)}"></div>
<div><label>الهاتف</label><input id="ct" value="${esc(e?.phone)}"></div><div><label>العنوان</label><input id="ca" value="${esc(e?.addr)}"></div><div><label>ICE</label><input id="ci" value="${esc(e?.ice)}"></div>
<button class="btn" onclick="saveC('${e?.id||''}')">حفظ</button></div></div>
<div class="card tw"><table><tr><th>الاسم</th><th>الهاتف</th><th>العنوان</th><th>ICE</th><th></th></tr>
${S.clients.map(c=>`<tr><td>${esc(c.name)}</td><td dir="ltr">${esc(c.phone)}</td><td>${esc(c.addr)}</td><td>${esc(c.ice)}</td>
<td><button class="btn g s" onclick="edit={k:'c',v:S.clients.find(x=>x.id=='${c.id}')};render()">تعديل</button> <button class="btn g s" onclick="del('clients','${c.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan=5>لا يوجد زبائن.</td></tr>'}</table></div>`}
function saveC(id){const n=$('#cn').value.trim();if(!n)return alert('أدخل الاسم');
const o={name:n,phone:$('#ct').value,addr:$('#ca').value,ice:$('#ci').value};
if(id)Object.assign(S.clients.find(p=>p.id===id),o);else S.clients.push({id:uid(),...o});save();edit=null;render()}
function docs(){
const L=S.docs.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.no-a.no);
return `<div class="card"><h2>من بون مكتوب بخط اليد</h2><div class="row"><div><label>الناتج</label><select style="font-weight:700;border:2px solid var(--red)" onchange="window.ivType=this.value;localStorage.setItem('sx_ivt',this.value)"><option value="facture" ${window.ivType!=='bon'?'selected':''}>فاتورة</option><option value="bon" ${window.ivType==='bon'?'selected':''}>بون (بدون TVA)</option></select></div></div><input id="ivf" type="file" accept="image/*" capture="environment" style="display:none" onchange="ivRead(this)"><input id="ivg" type="file" accept="image/*" style="display:none" onchange="ivRead(this)"><div class="row"><button class="btn k" onclick="document.getElementById('ivf').click()">📷 صوّر بون وحوله لفاتورة</button><button class="btn k" onclick="document.getElementById('ivg').click()">🖼️ اختر صورة من المعرض</button></div><small>${esc(ivMsg)}</small></div><div class="row"><button class="btn" onclick="newDoc('devis')">+ عرض ثمن جديد</button><button class="btn k" onclick="newDoc('facture')">+ فاتورة جديدة</button> <button class="btn k" onclick="newDoc('bon')">+ بون جديد</button></div>
<div class="card tw"><table><tr><th>النوع</th><th>الرقم</th><th>التاريخ</th><th>الزبون</th><th>TTC</th><th>الحالة</th><th></th></tr>
${L.map(d=>{const c=S.clients.find(x=>x.id===d.client);return `<tr><td>${d.type==='devis'?'عرض ثمن':d.type==='bon'?'بون':'فاتورة'}</td><td>${d.no}</td><td>${dfmt(d.date)}</td><td>${esc(c?.name||'-')}</td><td>${fmt(totals(d).ttc)}</td>
<td>${isSale(d)?(d.paid?'<span class="tag d">مدفوعة</span>':'<span class="tag r">غير مدفوعة</span>'):(d.converted?'<span class="tag d">حُوّل لفاتورة</span>':'<span class="tag">مفتوح</span>')}</td>
<td><button class="btn s" onclick="view='${d.id}';render()">عرض / PDF</button> ${d.type==='devis'&&!d.converted?`<button class="btn k s" onclick="toInv('${d.id}')">إلى فاتورة</button>`:''}${isSale(d)?`<button class="btn g s" onclick="pay('${d.id}')">${d.paid?'إلغاء الدفع':'تم الدفع'}</button>`:''} <button class="btn g s" onclick="del('docs','${d.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan=7>لا توجد وثائق.</td></tr>'}</table></div>`}
function newDoc(t){draft={id:uid(),type:t,date:today(),client:'',tva:20,lines:[],note:'',paid:false};render()}
function form(){const d=draft;const T=totals(d);
return `<div class="card"><h2>${d.type==='devis'?'عرض ثمن جديد':d.type==='bon'?'بون جديد':'فاتورة جديدة'}</h2><div class="row"><div><label>النوع</label><select onchange="setDT(this.value)"><option value="facture" ${d.type==='facture'?'selected':''}>فاتورة</option><option value="bon" ${d.type==='bon'?'selected':''}>بون</option><option value="devis" ${d.type==='devis'?'selected':''}>عرض ثمن</option></select></div><div><label>التاريخ</label><input type="date" value="${d.date}" onchange="draft.date=this.value"></div>
<div><label>الزبون</label><select onchange="draft.client=this.value"><option value="">-- اختر --</option>${S.clients.map(c=>`<option value="${c.id}" ${d.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${d.bon?`<label>أو اسم زبون جديد</label><input value="${esc(d.cname||'')}" onchange="draft.cname=this.value">`:''}</div>
${d.type==='bon'?'':`<div><label>TVA %</label><select onchange="draft.tva=+this.value;render()">${[20,14,10,7,0].map(v=>`<option ${d.tva===v?'selected':''}>${v}</option>`).join('')}</select></div>`}</div>

<script>
function parseVoice(text){
  var t=text.replace(/[\u0660-\u0669]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[\u06F0-\u06F9]/g,function(c){return c.charCodeAt(0)-1776});
  var m=t.match(/\d{1,3}(?:[\s.,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d+)?/g),price="",name=t;
  if(m){var last=m[m.length-1];name=t.replace(last,"");price=last.replace(/[\s.,](?=\d{3}(\D|$))/g,"").replace(",",".")}
  name=name.replace(/دراهم|درهم|dirhams?|\bdh\b|\bmad\b/gi," ").replace(/\s+/g," ").trim();
  return {name:name,price:price};
}
var _rec=null;
function voiceP(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition,l=localStorage.getItem('sx_lang')||'ar',T=function(x){return window.tr?tr(x):x};

    if(p.name)document.getElementById('pn').value=p.name;
    if(p.price)document.getElementById('pp').value=p.price;
    vh.textContent=T('سمعت:')+' '+txt+' — '+T(p.price?'تحقق من الاسم والسعر ثم اضغط حفظ':'لم أفهم السعر، اكتبه');
  };
  r.onerror=function(e){vh.textContent=(e.error==='not-allowed'?T('الميكروفون غير متاح. استعمل Chrome وأعطِ الإذن للميكروفون.'):'\u26a0 '+e.error)};
  r.onend=function(){_rec=null;mic.textContent=T('🎤 قل اسم المنتج وثمنه')};
  r.start();
}
